[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

# Sign model API: frontend calls /api/sign/* -> proxy to Render backend.
[[redirects]]
  from = "/api/*"
  to = "https://mediliosk.onrender.com/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
